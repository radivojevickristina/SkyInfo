<div class="password-page">

  <main class="password-card">

    <button
      type="button"
      class="logo"
      routerLink="/"
    >

      <span class="logo-icon">

        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M39 8 26 38c-.8 1.9-3.4 2-4.4.2l-5.3-10-10.2-5.3c-1.8-1-1.7-3.6.2-4.4L36.2 5.5C38.1 4.7 39.8 6.1 39 8Z"></path>
          <path d="m16.3 28.2 11.5-11.5"></path>
        </svg>

      </span>

      <span>
        {{'COMMON.APP_NAME' | translate}}
      </span>

    </button>


    <div class="password-icon">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="m3 7 9 6 9-6"></path>
      </svg>

    </div>


    <div class="password-heading">

      <small>
        {{'FORGOT_PASSWORD.EYEBROW' | translate}}
      </small>

      <h1>
        {{'FORGOT_PASSWORD.TITLE' | translate}}
      </h1>

      <p>
        {{'FORGOT_PASSWORD.DESCRIPTION' | translate}}
      </p>

    </div>


    <div class="password-form">

      <label for="email">
        {{'FORGOT_PASSWORD.EMAIL' | translate}}
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        [placeholder]="'FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
        autocomplete="email"
      >


      <p
        class="error-message"
        *ngIf="errorMessageKey!=''"
      >
        {{errorMessageKey | translate}}
      </p>


      <p
        class="success-message"
        *ngIf="messageKey!=''"
      >
        {{messageKey | translate}}
      </p>


      <button
        type="button"
        class="primary-button"
        (click)="sendResetLink()"
        [disabled]="isSending"
      >
        {{
          (isSending
            ? 'FORGOT_PASSWORD.SENDING'
            : 'FORGOT_PASSWORD.SEND_LINK') | translate
        }}
      </button>

    </div>


    <button
      type="button"
      class="back-button"
      routerLink="/login"
    >
      ← {{'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate}}
    </button>

  </main>

</div>
